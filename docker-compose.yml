services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: touchline
      POSTGRES_PASSWORD: touchline
      POSTGRES_DB: touchline
    ports: ["54329:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
